<style data-wp-block-html="css">
#ticketLookup {
  display: flex;
  flex-direction: column;
  gap: 12px;

  max-width: 420px;

  margin: 30px auto; /* centers form + adds top/bottom spacing */
  padding: 20px;      /* internal breathing space */

}

#ticketLookup input,
#ticketLookup button {
  padding: 10px;
  font-size: 16px;

  margin: 0; /* prevents browser default weird spacing */
}

#result {
  margin-top: 20px;
  font-weight: bold;

  text-align: center; /* optional but usually looks better */
}
</style>

<script data-wp-block-html="js">
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("ticketLookup");
  const result = document.getElementById("result");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    result.innerHTML = "Searching...";

    const surname = document.getElementById("surname").value.trim().toLowerCase();
    const yob = document.getElementById("yob").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const formData = new FormData();
    formData.append("surname", surname);
    formData.append("yob", yob);
    formData.append("phone", phone);

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbzE5DBs6NVeMqe3v3_SG72f6Fg5qY2gBnrFQmMekJqlFecXYtxytH_SPOyiMjaSo_47/exec", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (data.status === "success") {
        result.innerHTML =
          "Your Order ID: <b>" + data.orderNumber + "";
      } else {
        result.innerHTML = data.message;
      }

    } catch (err) {
      console.error(err);
      result.innerHTML = "Error connecting to server.";
    }

  });

});
</script>

<form id="ticketLookup">

  <input type="text" id="surname" placeholder="Surname" required="">

  <input type="number" id="yob" placeholder="Year of Birth" required="">

  <input type="text" id="phone" placeholder="Last 3 digits of phone" required="">

  <button type="submit">Find Ticket</button>

</form>

<div id="result"></div>
